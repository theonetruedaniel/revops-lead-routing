name: Routing sample checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run routing and verification regression tests
        run: python -m unittest -v
      - name: Regenerate and verify all fictional records
        run: |
          python route_leads.py
          python verify_sample.py
      - name: Ensure checked-in results are reproducible
        run: git diff --exit-code -- results/
